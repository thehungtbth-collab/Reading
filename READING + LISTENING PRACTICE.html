ou that this year there'},\\n{t:94.548, text:'will be a Summer Music School at the Arts Centre.'},\\n{t:98.280, text:'Classes at the Summer Music School will begin'},\\n{t:102.515, text:'on 5 July and will go on until the 30th.'},\\n{t:106.280, text:'The school is open to young people between the ages of 8 and 17.'},\\n{t:112.600, text:'There will be classes in piano and guitar and have you ever wanted to play the drums?'},\\n{t:119.960, text:'Well, you can learn at the summer school.'},\\n{t:123.040, text:'The teachers are all really excellent.'},\\n{t:127.200, text:'There will be classes every morning from'},\\n{t:130.731, text:'Monday to Friday beginning at 915 and finishing at 1145.'},\\n{t:137.441, text:'It doesn\\\\'t matter if you have never had music lessons before.'},\\n{t:141.441, text:'Beginners are welcome.'},\\n{t:144.600, text:'Students will only have to pay £3.25 a day, or £15 for a week.'},\\n{t:152.601, text:'For more information about the classes or to book'},\\n{t:154.902, text:'a place, phone the Arts Centre on 217, 3.081.'},\\n{t:163.561, text:'So, that\\\\'s the Summer Music School, a great place to play music and make new friends.'},\\n\",\"rawQuestions\":\"You will hear some information on the radio about a summer music school.\\nListen and complete questions 21-25.\\nYou will hear the information twice.\\n\\nSummer music school\\nPlace:                       Arts Centre\\nStarting date:         21 __________ July\\nLearn to play:         piano, guitar, 22   __________\\nClasses start at:     23 __________ a.m.\\nCost of classes:      24   £ __________ a day\\nPhone number:      25 __________\\n\"}];\n        let currentLessonIndex = 0;\n        let timerInterval; let seconds = 0;\n        let activePara = null;\n\n        function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }\n        function dragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }\n        \n        function drag(ev) { \n            const val = ev.target.dataset.val || ev.target.innerText.split('.')[0].trim();\n            ev.dataTransfer.setData(\"text\", val); \n            ev.dataTransfer.setData(\"sourceId\", ev.target.id);\n        }\n        \n        function drop(ev) { \n            ev.preventDefault(); \n            ev.currentTarget.classList.remove('drag-over'); \n            const data = ev.dataTransfer.getData(\"text\"); \n            const sourceId = ev.dataTransfer.getData(\"sourceId\");\n            const lesson = lessonsData[currentLessonIndex];\n            \n            // Nhận diện xem đây có phải là Option của dạng Vocab hay không\n            const isVocab = sourceId && sourceId.includes('drag-vocab');\n\n            // Hoàn trả lại item cũ nếu drop-zone đã có item\n            if ((lesson.removeDragged || isVocab) && ev.currentTarget.dataset.sourceId) {\n                const oldSource = document.getElementById(ev.currentTarget.dataset.sourceId);\n                if(oldSource) {\n                    oldSource.classList.remove('used');\n                    oldSource.style.display = ''; // Hiện lại nếu bị ẩn\n                }\n            }\n\n            ev.currentTarget.innerHTML = `<span class=\"dropped-item\">${data}</span>`; \n            ev.currentTarget.dataset.value = data.split('.')[0].trim(); \n            ev.currentTarget.dataset.sourceId = sourceId;\n\n            // Xử lý biến mất/làm mờ item mới kéo vào\n            if ((lesson.removeDragged || isVocab) && sourceId) {\n                const sourceEl = document.getElementById(sourceId);\n                if(sourceEl) {\n                    if (isVocab) {\n                        sourceEl.style.display = 'none'; // Biến mất HOÀN TOÀN với phần Vocab\n                    } else {\n                        sourceEl.classList.add('used'); // Chỉ làm mờ, gạch ngang với dạng kéo thả khác\n                    }\n                }\n            }\n            updatePaletteState();\n        }\n\n        // Xử lý Click vào Drop Zone để trả item về danh sách gốc\n        function handleDropZoneClick(ev) {\n            const lesson = lessonsData[currentLessonIndex];\n            const dz = ev.currentTarget;\n            const sourceId = dz.dataset.sourceId;\n            const isVocab = sourceId && sourceId.includes('drag-vocab');\n\n            // Nếu không phải vocab và cũng không tick checkbox \"Ẩn Opt Đã Kéo\" thì bỏ qua\n            if (!lesson.removeDragged && !isVocab) return;\n            \n            if (sourceId) {\n                const sourceEl = document.getElementById(sourceId);\n                if (sourceEl) {\n                    sourceEl.classList.remove('used');\n                    sourceEl.style.display = ''; // Phục hồi hiển thị cho item\n                }\n                dz.innerHTML = '';\n                dz.dataset.value = '';\n                dz.dataset.sourceId = '';\n            }\n            updatePaletteState();\n        }\n\t\t\n\t\twindow.checkVocabMatching = function(btn) {\n            const block = btn.closest('.vocab-block');\n            if (!block) return;\n            \n            const dropZones = block.querySelectorAll('.drop-zone');\n            \n            let correct = 0;\n            let total = dropZones.length;\n            \n            // Xóa các nút show key và thông báo cũ nếu học sinh bấm check nhiều lần\n            block.querySelectorAll('.vocab-show-key-btn, .correct-feedback').forEach(e => e.remove());\n            \n            dropZones.forEach(el => {\n                el.classList.remove('correct-answer', 'incorrect-answer');\n                \n                // Lấy đáp án đúng đã được gài sẵn\n                const correctVal = (el.dataset.answer || \"\").trim().toLowerCase();\n                let userVal = (el.dataset.value || \"\").trim().toLowerCase();\n                \n                if (userVal === correctVal && userVal !== \"\") {\n                    correct++;\n                    el.classList.add('correct-answer');\n                } else {\n                    el.classList.add('incorrect-answer');\n                    \n                    // Thêm nút Show Key bên cạnh ô làm sai\n                    if(correctVal) {\n                        const showKeyBtn = document.createElement('button');\n                        showKeyBtn.className = 'vocab-show-key-btn ml-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-[10px] px-2 py-1 rounded font-bold transition inline-block align-middle shadow-sm border border-gray-300';\n                        showKeyBtn.innerHTML = '<i class=\"fa-solid fa-key\"></i> Show Key';\n                        showKeyBtn.onclick = function() {\n                            const div = document.createElement('div');\n                            div.className = 'correct-feedback mt-1';\n                            div.innerText = `Key: ${el.dataset.answer}`;\n                            el.after(div);\n                            this.remove(); // Ẩn nút đi sau khi đã show\n                        };\n                        el.after(showKeyBtn);\n                    }\n                }\n            });\n            \n            // Hiển thị điểm số phần Vocab\n            const feedback = block.querySelector('.vocab-feedback');\n            if (feedback) {\n                feedback.innerText = `Kết quả Vocab: ${correct}/${total} câu chính xác`;\n                feedback.classList.remove('hidden');\n            }\n        };\n\n        // Thay thế hàm switchLesson cũ bằng hàm mới này\n        // Hàm chụp ảnh trạng thái bài làm\n        window.saveCurrentStateToMemory = () => {\n            if (currentLessonIndex === undefined || currentLessonIndex === null || !lessonsData[currentLessonIndex]) return;\n\n            // Đồng bộ value cho input text và gap-fill\n            document.querySelectorAll('#questions-content input[type=\"text\"]').forEach(el => {\n                el.setAttribute('value', el.value || '');\n            });\n            // Đồng bộ trạng thái checked cho trắc nghiệm (radio/checkbox)\n            document.querySelectorAll('#questions-content input[type=\"checkbox\"], #questions-content input[type=\"radio\"]').forEach(el => {\n                if(el.checked) el.setAttribute('checked', 'checked');\n                else el.removeAttribute('checked');\n            });\n\n            const qContent = document.getElementById('questions-content');\n            if (qContent && qContent.innerHTML.trim() !== '') {\n                lessonsData[currentLessonIndex].savedDOM = {\n                    questions: qContent.innerHTML,\n                    timer: seconds, // Lưu lại số giây đã đếm\n                    resultMessage: document.getElementById('result-message').innerHTML,\n                    resultMessageHidden: document.getElementById('result-message').classList.contains('hidden')\n                };\n            }\n        };\n\n        // Thay thế hàm switchLesson cũ bằng hàm mới này\n        function switchLesson(index) {\n            // 1. Lưu bài cũ trước khi chuyển đi (ngăn lưu nhầm mảng rỗng khi ở sảnh chờ)\n            const qContent = document.getElementById('questions-content');\n            if (typeof saveCurrentStateToMemory === 'function' && qContent && qContent.innerHTML.trim() !== '' && !document.body.classList.contains('in-dashboard')) {\n                saveCurrentStateToMemory();\n            }\n\n            currentLessonIndex = parseInt(index);\n            const lesson = lessonsData[currentLessonIndex];\n            \n            // 2. Render lại Audio, Transcript và cấu trúc cột\n            renderLesson(lesson);\n            const qsLabel = document.getElementById('top-total-qs');\n            if(qsLabel) qsLabel.innerText = (lesson.totalQs || 0) + ' câu';\n            \n            // 3. KIỂM TRA: Phục hồi trạng thái câu hỏi & đáp án nếu đã lưu\n            if (lesson.savedDOM) {\n                // Đắp lại HTML các đáp án đã điền/kéo thả\n                document.getElementById('questions-content').innerHTML = lesson.savedDOM.questions;\n                \n                // Khôi phục khung kết quả Xanh/Đỏ\n                const msg = document.getElementById('result-message');\n                msg.innerHTML = lesson.savedDOM.resultMessage;\n                if(lesson.savedDOM.resultMessageHidden) msg.classList.add('hidden');\n                else msg.classList.remove('hidden');\n\n                // Khôi phục đồng hồ tính giờ\n                if(timerInterval) clearInterval(timerInterval);\n                seconds = lesson.savedDOM.timer || 0;\n                timerInterval = setInterval(() => {\n                    seconds++;\n                    const m = Math.floor(seconds/60).toString().padStart(2, '0');\n                    const s = (seconds%60).toString().padStart(2, '0');\n                    document.getElementById('timer').innerText = `${m}:${s}`;\n                }, 1000);\n            } else {\n                // Chưa có dữ liệu lưu thì tạo mới từ đầu\n                resetState();\n            }\n\t\t\t// Đồng bộ lại nút Nộp Bài trên Header theo trạng thái của bài hiện tại\n    const btn = document.querySelector('button[onclick=\"checkResults()\"]');\n    if (btn) {\n        if (lesson.submitAttempt === 2 && !lesson.lastResult) {\n            btn.innerHTML = '<i class=\"fa-solid fa-rotate-right mr-1\"></i> Nộp Lần 2';\n            btn.className = 'bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold px-4 py-1.5 rounded shadow transition';\n            btn.disabled = false;\n        } else if (lesson.lastResult) {\n            btn.innerHTML = '<i class=\"fa-solid fa-check mr-1\"></i> Đã Nộp';\n            btn.className = 'bg-gray-500 text-white text-sm font-bold px-4 py-1.5 rounded shadow cursor-not-allowed opacity-70';\n            btn.disabled = true;\n        } else {\n            btn.innerHTML = '<i class=\"fa-solid fa-check mr-1\"></i> Nộp Bài';\n            btn.className = 'bg-green-600 hover:bg-green-700 text-white text-sm font-bold px-4 py-1.5 rounded shadow transition';\n            btn.disabled = false;\n        }\n    }\n\tbuildPalette(lesson);\n    const bottomActions = document.getElementById('bottom-actions');\n    const btnNext = document.getElementById('btn-next-lesson');\n    if(lesson.lastResult || lesson.submitAttempt >= 2) {\n        bottomActions.classList.remove('hidden');\n        if (currentLessonIndex < lessonsData.length - 1) {\n            btnNext.classList.remove('hidden');\n            btnNext.innerText = `Sang bài tiếp theo: ${lessonsData[currentLessonIndex + 1].name} ❯❯`;\n        } else btnNext.classList.add('hidden');\n    } else {\n        bottomActions.classList.add('hidden');\n    }\n        }\n\n        function renderLesson(lesson) {\n            const audio = document.getElementById('audio');\n            audio.src = lesson.audio;\n            document.getElementById('transcript').innerHTML = lesson.processedTranscript;\n            document.getElementById('questions-content').innerHTML = lesson.processedQuestions;\n\n            const transWrap = document.getElementById('transcript-container');\n            const transPlace = document.getElementById('transcript-placeholder');\n            document.getElementById('trans-btn-container').innerHTML = `<span class=\"text-xs text-slate-400\"><i class=\"fa-solid fa-music mr-1\"></i>Audio Source</span>\n                <button onclick=\"toggleTrans()\" class=\"bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded text-xs transition border border-slate-500\">${lesson.hideTrans ? 'Hiện Văn Bản' : 'Ẩn Văn Bản'}</button>`;\n            \n            if (lesson.hideTrans) { transWrap.classList.add('hidden'); transPlace.classList.remove('hidden'); }\n            else { transWrap.classList.remove('hidden'); transPlace.classList.add('hidden'); }\n\t\t\t\n            const paneTrans = document.getElementById('pane-transcript');\n            const paneQuest = document.getElementById('pane-questions');\n            const resizer1 = document.getElementById('resizer-1');\n\n            paneTrans.style.width = '';                 \n            paneQuest.style.width = '';\n            \n            const questContentWrap = paneQuest.querySelector('.max-w-full');\n            if(questContentWrap) {\n                questContentWrap.classList.remove('max-w-full', 'w-full');\n                questContentWrap.classList.add('max-w-3xl');\n            }\n            document.getElementById('questions-content').classList.remove('text-lg');\n\n            attachAudioListeners();\n            setTimeout(initResize, 100);\n        }\n\n        function toggleTrans() {\n            document.getElementById('transcript-container').classList.toggle('hidden');\n            document.getElementById('transcript-placeholder').classList.toggle('hidden');\n        }\n\n        function resetState() {\n            document.getElementById('result-message').classList.add('hidden');\n            seconds = 0; if(timerInterval) clearInterval(timerInterval);\n            timerInterval = setInterval(() => {\n                seconds++;\n                const m = Math.floor(seconds/60).toString().padStart(2, '0');\n                const s = (seconds%60).toString().padStart(2, '0');\n                document.getElementById('timer').innerText = `${m}:${s}`;\n            }, 1000);\n        }\n\n        function attachAudioListeners() {\n            const audio = document.getElementById('audio');\n            const paras = document.querySelectorAll('#transcript p');\n            activePara = null;\n            \n            // --- LOGIC MỚI: Thu thập thời gian của tất cả các nút Play ---\n            const playBtns = document.querySelectorAll('.play-here-btn');\n            let qTimings = [];\n            playBtns.forEach(btn => {\n                const time = parseFloat(btn.dataset.time);\n                if (!isNaN(time)) qTimings.push({ btn, time });\n            });\n            // Sắp xếp các nút theo thứ tự thời gian từ bé đến lớn\n            qTimings.sort((a, b) => a.time - b.time);\n\n            audio.ontimeupdate = () => {\n                const time = audio.currentTime;\n                const alerts = document.querySelectorAll('.alert-trigger');\n                let current = null;\n                \n                paras.forEach(p => {\n                    const t = parseFloat(p.dataset.time);\n                    p.classList.remove('active');\n                    if (time >= t) current = p;\n                });\n\n                if (current) {\n                    current.classList.add('active');\n                    if (!document.getElementById('transcript-container').classList.contains('hidden')) {\n                        if (current !== activePara) current.scrollIntoView({ behavior: 'smooth', block: 'center' });\n                    }\n                    activePara = current;\n\n                    // Sparkles trigger\n                    current.querySelectorAll('.keyword-sparkle').forEach(sp => {\n                        sp.classList.remove('trigger');\n                        void sp.offsetWidth;\n                        sp.classList.add('trigger');\n                        const targetId = sp.dataset.targetInput;\n                        if (targetId) {\n                            const inputEl = document.getElementById(targetId);\n                            if (inputEl) {\n                                inputEl.classList.add('highlight-input');\n                                setTimeout(() => inputEl.classList.remove('highlight-input'), 2000);\n                            }\n                        }\n                    });\n                }\n                \n                // Alerts trigger\n                alerts.forEach(al => {\n                    let parentP = al.closest('p');\n                    if(!parentP) {\n                        let prev = al.previousElementSibling;\n                        while(prev && prev.tagName !== 'P') prev = prev.previousElementSibling;\n                        if(prev) parentP = prev;\n                    }\n                    if(parentP && parentP.dataset.time) {\n                        const t = parseFloat(parentP.dataset.time);\n                        if (time >= t && time < t + 1) {\n                            const targetId = al.dataset.targetQuestion;\n                            if (targetId) {\n                                const block = document.getElementById(targetId);\n                                if(block) { \n                                    block.classList.add('highlight-block'); \n                                    setTimeout(() => block.classList.remove('highlight-block'), 5000); \n                                    block.scrollIntoView({ behavior: 'smooth', block: 'center' }); \n                                }\n                            }\n                        }\n                    }\n                });\n\n                // --- LOGIC MỚI: Dò tìm và thả Dấu Tick Xanh & Chuông Chú Ý ---\n                for (let i = 0; i < qTimings.length; i++) {\n                    const currentQ = qTimings[i];\n                    const nextQ = qTimings[i+1];\n                    \n                    // 1. XỬ LÝ CHUÔNG BÁO CHÚ Ý (Nếu công tắc được bật)\n                    const bellToggle = document.getElementById('bell-toggle');\n                    if (bellToggle && bellToggle.checked) {\n                        // Kích hoạt khi qua mốc time một chút (0 - 1.5s để chặn sai số nếu học sinh tua nhanh)\n                        if (time >= currentQ.time && time < currentQ.time + 1.5) {\n                            if (!currentQ.bellRinging) {\n                                currentQ.bellRinging = true;\n                                const bell = document.createElement('span');\n                                bell.className = 'attention-bell';\n                                bell.innerHTML = '<i class=\"fa-solid fa-bell mr-1\"></i> Chú ý';\n                                currentQ.btn.after(bell); // Thả chuông ngay cạnh nút Play\n                                \n                                // Tự động xóa chuông sau 3 giây\n                                setTimeout(() => {\n                                    if (bell.parentNode) bell.remove();\n                                }, 3000);\n                            }\n                        } else if (time < currentQ.time) {\n                            // Reset trạng thái nếu học sinh tua ngược audio về trước\n                            currentQ.bellRinging = false; \n                        }\n                    }\n\n                    // 2. XỬ LÝ DẤU TICK HOÀN THÀNH\n                    let isDone = false;\n                    if (nextQ) {\n                        if (time >= nextQ.time) isDone = true;\n                    } else {\n                        if (time >= currentQ.time + 15 || audio.ended) isDone = true;\n                    }\n                    \n                    // Tìm dấu tick xanh an toàn (tránh đụng chạm element chuông)\n                    let tickEl = null;\n                    let sibling = currentQ.btn.nextElementSibling;\n                    while (sibling) {\n                        if (sibling.classList.contains('done-tick')) {\n                            tickEl = sibling; \n                            break;\n                        }\n                        sibling = sibling.nextElementSibling;\n                    }\n                    \n                    if (isDone) {\n                        if (!tickEl) {\n                            const tick = document.createElement('i');\n                            tick.className = 'fa-solid fa-circle-check done-tick';\n                            tick.title = \"Audio đã phát qua phần này\";\n                            currentQ.btn.after(tick); \n                        }\n                    } else {\n                        if (tickEl) tickEl.remove(); // Thu hồi nếu tua ngược\n                    }\n                }\n            };\n            \n            paras.forEach(p => { \n                p.onclick = () => { \n                    audio.currentTime = parseFloat(p.dataset.time); \n                    audio.play(); \n                }; \n            });\n        }\n\n        function initResize() {\n           const mainContainer = document.getElementById('main-container');\n           if(!mainContainer || window.innerWidth < 768) return; \n\n           const resizer1 = document.getElementById('resizer-1');\n           const paneTrans = document.getElementById('pane-transcript');\n           if(resizer1 && paneTrans) {\n               const newResizer1 = resizer1.cloneNode(true);\n               resizer1.parentNode.replaceChild(newResizer1, resizer1);\n               newResizer1.addEventListener('mousedown', function(e) {\n                   e.preventDefault(); newResizer1.classList.add('active'); document.body.style.cursor = 'col-resize';\n                   const startX = e.clientX; const startWidth = paneTrans.getBoundingClientRect().width; const containerWidth = mainContainer.getBoundingClientRect().width;\n                   function onMouseMove(e) { const dx = e.clientX - startX; let newWidth = ((startWidth + dx) / containerWidth) * 100; if(newWidth < 20) newWidth = 20; if(newWidth > 60) newWidth = 60; paneTrans.style.width = newWidth + '%'; }\n                   function onMouseUp() { newResizer1.classList.remove('active'); document.body.style.cursor = ''; document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); }\n                   document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);\n               });\n           }\n        }\n        window.addEventListener('resize', initResize);\n\n        function checkResults() {\n    const lesson = lessonsData[currentLessonIndex];\n    const key = lesson.answerKey;\n    let score = 0; let total = 0;\n    if(Object.keys(key).length === 0) return alert(\"Chưa cài đặt đáp án.\");\n\n    // Khởi tạo biến đếm số lần nộp bài (mặc định là 1)\n    if (!lesson.submitAttempt) lesson.submitAttempt = 1;\n\n    document.querySelectorAll('.correct-feedback').forEach(e => e.remove());\n    document.querySelectorAll('.correct-answer, .incorrect-answer, .correct-text').forEach(e => e.classList.remove('correct-answer', 'incorrect-answer', 'correct-text'));\n\n    for(const [id, val] of Object.entries(key)) {\n        const el = document.getElementById(id);\n        if(el && (el.tagName === 'INPUT' || el.classList.contains('drop-zone'))) {\n            total++;\n            let userVal = el.tagName === 'INPUT' ? el.value.trim().toLowerCase() : (el.dataset.value || \"\").trim().toLowerCase();\n            const options = val.split(/[,\\/]/).map(s => s.trim().toLowerCase());\n            \n            if(options.includes(userVal)) {\n                score++; \n                el.classList.add('correct-answer');\n            } else {\n                el.classList.add('incorrect-answer');\n                // CHỈ HIỆN ĐÁP ÁN NẾU LÀ LẦN NỘP THỨ 2\n                if (lesson.submitAttempt >= 2) {\n                    const div = document.createElement('div'); \n                    div.className = 'correct-feedback'; \n                    div.innerText = `Correct: ${val}`; \n                    el.after(div);\n                }\n            }\n        } else {\n            const inputs = document.getElementsByName(id);\n            if(inputs.length > 0) {\n                const type = inputs[0].type;\n                if(type === 'radio') {\n                    total++;\n                    let selected = \"\"; \n                    for(let i of inputs) if(i.checked) selected = i.value.toUpperCase();\n                    if(selected === val.toUpperCase()) { score++; }\n                    \n                    for(let i of inputs) {\n                        const char = i.value.toUpperCase();\n                        const target = i.closest('td') || i.parentElement;\n                        \n                        if (i.checked && char === val.toUpperCase()) {\n                            // Chọn đúng\n                            target.classList.add('correct-text');\n                        } else if (i.checked && char !== val.toUpperCase()) {\n                            // Chọn sai\n                            target.classList.add('incorrect-answer');\n                        } else if (!i.checked && char === val.toUpperCase()) {\n                            // Bỏ lỡ đáp án đúng -> CHỈ SHOW Ở LẦN 2\n                            if (lesson.submitAttempt >= 2) {\n                                target.classList.add('correct-text');\n                            }\n                        }\n                    }\n                } else if(type === 'checkbox') {\n                    const keyArr = val.toUpperCase().split(/[,\\s/&]+/).filter(x=>x);\n                    total += keyArr.length;\n                    let correctCount = 0;\n                    \n                    for(let i of inputs) {\n                        const char = i.parentElement.innerText.trim().charAt(0).toUpperCase();\n                        if(i.checked) {\n                            if(keyArr.includes(char)) {\n                                correctCount++;\n                                i.parentElement.classList.add('correct-text');\n                            } else {\n                                i.parentElement.classList.add('incorrect-answer');\n                            }\n                        } else {\n                            // Bỏ lỡ đáp án đúng -> CHỈ SHOW Ở LẦN 2\n                            if(keyArr.includes(char) && lesson.submitAttempt >= 2) {\n                                i.parentElement.classList.add('correct-text');\n                            }\n                        }\n                    }\n                    score += correctCount;\n                }\n            }\n        }\n    }\n    \n    // Tùy biến Nút Submit & Cảnh báo dựa theo số lần nộp\n    const msg = document.getElementById('result-message');\n    const btn = document.querySelector('button[onclick=\"checkResults()\"]');\n\n    if (lesson.submitAttempt === 1 && score < total) {\n        // Lần 1: Còn câu sai -> Cho làm lại\n        msg.innerText = `Bạn làm đúng ${score}/${total} câu. Hãy kiểm tra lại những câu sai (màu đỏ) và nộp bài lần nữa nhé!`;\n        msg.classList.remove('hidden');\n        \n        if (btn) {\n            btn.innerHTML = '<i class=\"fa-solid fa-rotate-right mr-1\"></i> Nộp Lần 2';\n            btn.className = 'bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold px-4 py-1.5 rounded shadow transition';\n        }\n        lesson.submitAttempt = 2; // Tăng mốc để lần bấm sau sẽ chốt sổ\n    } else {\n        // Lần 2 HOẶC Lần 1 đúng 100% -> Chốt sổ\n        msg.innerText = `Kết quả cuối cùng: ${score}/${total} câu đúng`;\n        msg.classList.remove('hidden');\n        \n        if (btn) {\n            btn.innerHTML = '<i class=\"fa-solid fa-check mr-1\"></i> Đã Nộp';\n            btn.className = 'bg-gray-500 text-white text-sm font-bold px-4 py-1.5 rounded shadow cursor-not-allowed opacity-70';\n            btn.disabled = true; // Khóa nút nộp\n        }\n        \n        // Lưu kết quả và dừng đồng hồ\n        if(window.timerInterval) clearInterval(window.timerInterval);\n        lessonsData[currentLessonIndex].lastResult = score + \"/\" + total;\n    }\n\t\n\tupdatePaletteState(); // Cập nhật màu đỏ/xanh lá cây\n    document.getElementById('bottom-actions').classList.remove('hidden');\n    const btnNext = document.getElementById('btn-next-lesson');\n    if (currentLessonIndex < lessonsData.length - 1) {\n        btnNext.classList.remove('hidden');\n        btnNext.innerText = `Sang bài tiếp theo: ${lessonsData[currentLessonIndex + 1].name} ❯❯`;\n    } else btnNext.classList.add('hidden');\n}\n\n        window.onload = () => {\n            renderDashboard();\n            const selector = document.getElementById('lesson-selector');\n            lessonsData.forEach((l, i) => {\n                const opt = document.createElement('option'); opt.value = i; opt.innerText = l.name;\n                selector.appendChild(opt);\n            });\n        };\n\n        function renderDashboard() {\n            const cardArea = document.getElementById('card-render-area');\n            let cardsHtml = '';\n\n            // Đã xóa bỏ dòng lặp dư thừa ở đây\n            lessonsData.forEach((d, i) => {\n                let totalQs = d.totalQs || 0;\n                let qCounts = {};\n                \n                // Tự động quét mã HTML để xem bài có chứa dạng câu hỏi nào\n                if (d.processedQuestions.includes('type=\"radio\"') || d.processedQuestions.includes('type=\"checkbox\"')) qCounts['Multiple Choice'] = '✔';\n                if (d.processedQuestions.includes('<input type=\"text\"')) qCounts['Gap Fill'] = '✔';\n                if (d.processedQuestions.includes('class=\"drop-zone\"')) qCounts['Matching'] = '✔';\n\n                // Tạo các thẻ Tag\n                let tagsHtml = '';\n                for (const [tName, val] of Object.entries(qCounts)) {\n                    tagsHtml += `<div class=\"q-tag\">${tName} <span class=\"q-tag-count\">${val}</span></div>`;\n                }\n                if (tagsHtml === '') tagsHtml = `<div class=\"q-tag\">Listening Task <span class=\"q-tag-count\">${totalQs}</span></div>`;\n\t\t\t\t\n\t\t\t\t// Hiển thị điểm số nếu đã có\n                if (d.lastResult) {\n                    tagsHtml += `<div class=\"q-tag\" style=\"background:#f0fdf4; color:#16a34a; border-color:#bbf7d0;\">Kết quả: <span class=\"q-tag-count\" style=\"background:#16a34a; color:white;\">${d.lastResult}</span></div>`;\n                }\n\n                cardsHtml += `\n                <div class=\"test-card\">\n                    <div class=\"card-header\"><i class=\"fa-solid fa-headphones text-xl mt-0.5\"></i> ${d.name || 'Untitled'}</div>\n                    <div class=\"q-types-box\">${tagsHtml}</div>\n                    <div class=\"card-stats\">\n                        <div class=\"stat-item\"><i class=\"fa-solid fa-check-square\"></i> ${totalQs} câu</div>\n                        <div class=\"stat-item\"><i class=\"fa-solid fa-clock\"></i> Không giới hạn</div>\n                    </div>\n                    <button class=\"btn-enter\" onclick=\"startTest(${i})\">Vào thi ❯</button>\n                </div>`;\n            });\n            \n            cardArea.innerHTML = cardsHtml;\n            document.body.classList.add('in-dashboard');\n        }\n\n        window.startTest = (idx) => {\n            // 1. Loại bỏ class ẩn giao diện chính\n            document.body.classList.remove('in-dashboard');\n            // 2. Ẩn hẳn Dashboard view để không che bài tập\n            document.getElementById('dashboard-view').style.display = 'none';\n            // 3. Chuyển bài và render\n            document.getElementById('lesson-selector').value = idx;\n            switchLesson(idx);\n        };\n\n        window.goBackToDashboard = () => {\n            if(confirm(\"Bạn có muốn quay lại danh sách bài tập? (Tiến độ và kết quả sẽ được lưu tạm)\")) {\n                saveCurrentStateToMemory(); // Chụp ảnh trạng thái trước khi thoát\n                \n                // 1. Hiện lại Dashboard view\n                document.getElementById('dashboard-view').style.display = 'flex';\n                // 2. Thêm class để ẩn giao diện làm bài\n                document.body.classList.add('in-dashboard');\n                \n                // Dừng các hoạt động của bài thi\n                if(window.timerInterval) clearInterval(window.timerInterval);\n                const audio = document.getElementById('audio');\n                if(audio) audio.pause();\n                \n                // Vẽ lại Dashboard để hiển thị điểm vừa lưu\n                renderDashboard();\n            }\n        };\n\t\t\n\t\t// --- LOGIC QUESTION PALETTE & BOTTOM ACTIONS ---\nfunction buildPalette(lesson) {\n    const pal = document.getElementById('question-palette');\n    pal.innerHTML = '';\n    const key = lesson.answerKey;\n    if (!key || Object.keys(key).length === 0) return;\n    \n    let fallbackCounter = 1;\n    \n    for (const id in key) {\n        let qLabel = \"\";\n        const el = document.getElementById(id);\n        \n        if (el) {\n            // Dạng 1: Trắc nghiệm (Radio/Checkbox)\n            if (el.classList.contains('question-block')) {\n                const badge = el.querySelector('.q-badge, .bg-blue-100');\n                if (badge) qLabel = badge.innerText.trim();\n            } \n            // Dạng 2: Điền từ (Gap-fill) hoặc Kéo thả (Drop-zone)\n            else if (el.tagName === 'INPUT' || el.classList.contains('drop-zone')) {\n                const prev = el.previousElementSibling;\n                if (prev && prev.tagName === 'SPAN') {\n                    qLabel = prev.innerText.trim();\n                } else {\n                    // Nếu nằm trong bảng, thử tìm nhãn xung quanh ô đó\n                    const parent = el.parentElement;\n                    if (parent) {\n                        const badge = parent.querySelector('.q-badge, .bg-blue-100');\n                        if (badge) qLabel = badge.innerText.trim();\n                    }\n                }\n            }\n        } else {\n            // Dạng 3: Map Grid (Không có thẻ ID trực tiếp, phải quét qua Name của thẻ Radio)\n            const inputs = document.getElementsByName(id);\n            if (inputs.length > 0) {\n                const tr = inputs[0].closest('tr');\n                if (tr) {\n                    const firstTd = tr.querySelector('td');\n                    if (firstTd) {\n                        const match = firstTd.innerText.match(/^\\d+/);\n                        if (match) qLabel = match[0];\n                    }\n                }\n            }\n        }\n\n        // Nếu câu nào đề bài không ghi số, dùng biến đếm dự phòng nối tiếp\n        if (!qLabel || qLabel === '#') {\n            qLabel = fallbackCounter;\n        } else {\n            // Cập nhật lại bộ đếm cho khớp với số hiện tại\n            const parsedNum = parseInt(qLabel);\n            if (!isNaN(parsedNum)) fallbackCounter = parsedNum;\n        }\n        fallbackCounter++;\n\n        // Render nút bấm\n        const btn = document.createElement('button');\n        btn.className = 'palette-btn';\n        btn.innerText = qLabel;\n        btn.dataset.targetId = id;\n        btn.onclick = () => scrollToQuestion(id);\n        pal.appendChild(btn);\n    }\n    updatePaletteState();\n}\n\n\t\tfunction updatePaletteState() {\n            document.querySelectorAll('.palette-btn').forEach(btn => {\n                const id = btn.dataset.targetId;\n                let answered = false; let isCorrect = false; let isIncorrect = false;\n                \n                const el = document.getElementById(id);\n                if(el) {\n                    if(el.tagName === 'INPUT') {\n                        answered = el.value.trim() !== '';\n                    } \n                    else if(el.classList.contains('drop-zone')) {\n                        answered = (el.dataset.value || '').trim() !== '';\n                    } \n                    else if (el.classList.contains('question-block')) {\n                        // Nhận diện xuyên thấu vào các câu Multiple Choice (Radio/Checkbox)\n                        const inputs = el.querySelectorAll('input[type=\"radio\"], input[type=\"checkbox\"]');\n                        if (inputs.length > 0) {\n                            for(let i of inputs) {\n                                if(i.checked) answered = true;\n                                const target = i.parentElement;\n                                if(target.classList.contains('correct-text') || target.classList.contains('correct-answer')) isCorrect = true;\n                                if(target.classList.contains('incorrect-answer')) isIncorrect = true;\n                            }\n                        }\n                    }\n                    \n                    // Quét đúng sai cho dạng text/drop-zone\n                    if(el.classList.contains('correct-answer')) isCorrect = true;\n                    if(el.classList.contains('incorrect-answer')) isIncorrect = true;\n                } else {\n                    // Nhận diện cho Map Grid\n                    const inputs = document.getElementsByName(id);\n                    if(inputs.length) {\n                        for(let i of inputs) {\n                            if(i.checked) answered = true;\n                            const target = i.closest('td') || i.parentElement;\n                            if(target.classList.contains('correct-text') || target.classList.contains('correct-answer')) isCorrect = true;\n                            if(target.classList.contains('incorrect-answer')) isIncorrect = true;\n                        }\n                    }\n                }\n                \n                btn.className = 'palette-btn'; // Reset\n                if (isIncorrect) btn.classList.add('incorrect');\n                else if (isCorrect) btn.classList.add('correct');\n                else if (answered) btn.classList.add('answered');\n            });\n        }\n\nfunction scrollToQuestion(id) {\n    let el = document.getElementById(id);\n    if(!el) {\n        const inputs = document.getElementsByName(id);\n        if(inputs.length) el = inputs[0].closest('.question-block') || inputs[0].closest('tr');\n    }\n    if(el) {\n        el.scrollIntoView({behavior: 'smooth', block: 'center'});\n        el.classList.remove('blink-effect');\n        void el.offsetWidth; // Trigger reflow\n        el.classList.add('blink-effect');\n    }\n}\n\n// Lắng nghe sự kiện gõ phím/chọn đáp án để tô màu xanh da trời\ndocument.addEventListener('input', (e) => { if(e.target.closest('#questions-content')) updatePaletteState(); });\ndocument.addEventListener('change', (e) => { if(e.target.closest('#questions-content')) updatePaletteState(); });\n\nwindow.goToNextLesson = () => {\n    if(currentLessonIndex < lessonsData.length - 1) {\n        startTest(currentLessonIndex + 1);\n        document.getElementById('pane-questions').scrollTo(0,0);\n    }\n};\n\nwindow.saveCurrentResult = () => {\n    saveCurrentStateToMemory();\n    const clone = document.documentElement.cloneNode(true);\n    \n    // Dọn dẹp giao diện trước khi xuất file tĩnh\n    ['#dashboard-view', '.back-btn', '#bottom-actions'].forEach(sel => {\n        const el = clone.querySelector(sel);\n        if(el) el.remove();\n    });\n    clone.querySelectorAll('script').forEach(s => s.remove());\n    clone.querySelector('button[onclick=\"checkResults()\"]').remove();\n    \n    const html = \"<!DOCTYPE html>\\n\" + clone.outerHTML;\n    const blob = new Blob([html], {type: \"text/html;charset=utf-8\"});\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob);\n    a.download = `Result_${lessonsData[currentLessonIndex].name}.html`;\n    a.click();\n};\n    <\/script>\n</body>\n</html>\n    "},{"id":"jlrc59hrz","name":"LISTENING PRACTICE (09.09.2026) (B1 - 11-12).html","content":"<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Listening Exercises</title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <style>\n        ::-webkit-scrollbar { width: 8px; }\n        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }\n        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }\n        #transcript p { padding: 8px 12px; margin-bottom: 4px; border-radius: 6px; transition: all 0.3s; color: #64748b; cursor: pointer; border-left: 3px solid transparent; }\n        #transcript p:hover { background: #f8fafc; }\n        #transcript p.active { background: #eff6ff; color: #1e40af; font-weight: 500; border-left-color: #3b82f6; }\n        @keyframes sparkleAnim { 0% { transform: scale(1); text-shadow: none; color: inherit; } 50% { transform: scale(1.5); text-shadow: 0 0 10px #fbbf24; color: #d97706; } 100% { transform: scale(1); } }\n        .keyword-sparkle { transition: all 0.3s; border-bottom: 2px solid transparent; display: inline-block; }\n        .keyword-sparkle.trigger { animation: sparkleAnim 1.5s ease-in-out; font-weight: bold; border-bottom-color: #f59e0b; }\n        .text-highlight { background-color: #fef08a; color: #854d0e; padding: 0 2px; border-radius: 2px; font-weight: bold; transition: all 0.3s; }\n        #transcript p.active .text-highlight { background-color: #facc15; }\n        \n        input[type=\"text\"] { transition: all 0.3s; border-bottom: 2px solid #cbd5e1; padding: 2px 8px; text-align: center; color: #2563eb; font-weight: 600; background: #f8fafc; border-radius: 4px 4px 0 0; min-width: 60px; }\n        input[type=\"text\"]:focus { outline: none; border-bottom-color: #3b82f6; background: #eff6ff; }\n        \n        /* Hiệu ứng Alert và Sparkle */\n        input[type=\"text\"].highlight-input { background-color: #fef9c3; border-bottom-color: #eab308; transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }\n        .question-block { transition: all 0.3s; }\n        .question-block.highlight-block { border-left: 4px solid #ef4444; background: #fef2f2; padding-left: 12px; }\n\n        /* Table Styles */\n        .generated-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9em; }\n        .generated-table td, .generated-table th { border: 1px solid #e2e8f0; padding: 8px; vertical-align: middle; }\n        .generated-table tr:nth-child(even) { background-color: #f8fafc; }\n        .generated-table tr:hover { background-color: #f1f5f9; }\n        .generated-table td input { width: 90%; min-width: 40px; }\n\n        .draggable-item { cursor: grab; background: white; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 4px; display: inline-block; margin: 4px; font-size: 0.9em; box-shadow: 0 1px 2px rgba(0,0,0,0.05); user-select: none; transition: all 0.2s; max-width: 100%; word-break: break-word; white-space: normal; line-height: 1.4; text-align: left; }\n        .draggable-item:active { cursor: grabbing; border-color: #3b82f6; }\n        .draggable-item.used { opacity: 0.4; background: #e2e8f0; text-decoration: line-through; pointer-events: none; border-color: #cbd5e1; box-shadow: none; }\n        \n        .drop-zone { display: inline-flex; align-items: center; justify-content: flex-start; min-width: 80px; min-height: 32px; border: 2px dashed #cbd5e1; border-radius: 4px; background: #f8fafc; vertical-align: middle; margin: 0; text-align: left; line-height: 1.4; position: relative; transition: all 0.2s; max-width: 100%; padding: 4px 8px; box-sizing: border-box; overflow: hidden; }\n        .drop-zone.drag-over { background: #eff6ff; border-color: #3b82f6; transform: scale(1.02); }\n        .drop-zone.cursor-pointer:hover { border-color: #94a3b8; background: #f1f5f9; }\n        .drop-zone .dropped-item { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 2px; display: block; width: 100%; font-weight: bold; pointer-events: none; word-break: break-word; white-space: normal; text-align: left; font-size: 0.9em; margin: 0; }\n        \n\t\t/* Grading Styles */\n        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }\n        .incorrect-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }\n        .correct-text { color: #15803d; font-weight: bold; }\n        .correct-feedback { display: block; margin-top: 4px; color: #16a34a; font-weight: bold; font-size: 0.875rem; animation: fadeIn 0.5s; }\n        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }\n        \n        .resizer-bar { width: 8px; background-color: #cbd5e1; cursor: col-resize; flex-shrink: 0; z-index: 30; display: flex; justify-content: center; align-items: center; border-left: 1px solid #94a3b8; }\n        .resizer-bar::after { content: \"||\"; color: #475569; font-size: 10px; }\n\t\t\n\t\t/* --- GIAO DIỆN DASHBOARD CARD --- */\n        #dashboard-view { position: fixed; inset: 0; background: #f4f7f6; z-index: 1000; overflow-y: auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }\n        .dash-title { font-size: 24px; font-weight: 800; color: #0f766e; margin-bottom: 30px; text-transform: uppercase; }\n        .card-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; width: 100%; }\n        .test-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; width: 340px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; display: flex; flex-direction: column; }\n        .test-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }\n        .card-header { display: flex; align-items: flex-start; gap: 10px; color: #115e59; font-weight: 700; font-size: 16px; margin-bottom: 12px; text-transform: uppercase; line-height: 1.4; }\n        .q-types-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; flex: 1; align-content: flex-start; }\n        .q-tag { background: #fff; border: 1px solid #e2e8f0; color: #475569; font-size: 11px; padding: 4px 8px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 4px; font-weight: 600; }\n        .q-tag-count { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; }\n        .card-stats { background: #fff1f2; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; margin-bottom: 20px; }\n        .stat-item { display: flex; align-items: center; gap: 6px; color: #9a3412; font-size: 13px; font-weight: 600; }\n        .btn-enter { background: #e0f2fe; color: #0369a1; padding: 10px 0; width: 100%; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #bae6fd; transition: 0.2s; text-align: center; }\n        .btn-enter:hover { background: #bae6fd; }\n        \n        /* Ẩn giao diện chính khi ở sảnh chờ */\n        body.in-dashboard > header, body.in-dashboard > main { display: none !important; }\n        \n        /* Nút quay lại */\n        .back-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: 0.2s; margin-right: 16px; }\n        .back-btn:hover { background: #e2e8f0; color: #1e293b; }\n\t\t\n\t\t/* User Highlight & Note Styles */\n        .user-hl { cursor: pointer; border-radius: 2px; transition: opacity 0.2s; }\n        .user-hl:hover { opacity: 0.7; }\n        .user-note { \n            border-bottom: 2px dashed #f59e0b; \n            background-color: rgba(245, 158, 11, 0.1); \n            cursor: pointer; \n            position: relative; \n            transition: all 0.2s;\n        }\n        .user-note:hover { background-color: rgba(245, 158, 11, 0.3); }\n        .user-note::after {\n            content: '\\f249'; /* FontAwesome sticky-note icon */\n            font-family: \"Font Awesome 6 Free\";\n            font-weight: 900;\n            font-size: 10px;\n            color: #d97706;\n            vertical-align: super;\n            margin-left: 2px;\n        }\n        #floating-note-btn { \n            position: absolute; z-index: 1000; \n            background: #1e293b; color: white; \n            padding: 5px 12px; border-radius: 6px; \n            font-size: 13px; font-weight: bold; \n            cursor: pointer; display: none; \n            box-shadow: 0 4px 6px rgba(0,0,0,0.2); \n        }\n        #floating-note-btn:hover { background: #3b82f6; }\n\t\t\n/* Style số câu hỏi giống hệt gap-fill */\n        .q-badge {\n            background-color: #dbeafe; /* bg-blue-100 */\n            color: #1d4ed8; /* text-blue-700 */\n            padding: 2px 6px; /* px-1.5 py-0.5 */\n            border-radius: 4px; /* rounded */\n            font-size: 11px; /* text-[11px] */\n            font-weight: 700; /* font-bold */\n            border: 1px solid #bfdbfe; /* border-blue-200 */\n            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */\n            display: inline-block;\n            vertical-align: middle;\n            margin-right: 6px;\n        }\n\n        /* MCQ Option: Chữ cái nằm trong nút tròn */\n        .mcq-option {\n            display: flex;\n            align-items: center;\n            padding: 8px 12px;\n            margin-bottom: 5px;\n            border: 1px solid #e2e8f0;\n            border-radius: 8px;\n            cursor: pointer;\n            transition: all 0.2s;\n            background: #fff;\n        }\n        .mcq-option:hover { background-color: #f8fafc; border-color: #cbd5e1; }\n        .mcq-option input { display: none; } /* Ẩn nút radio/checkbox gốc */\n\n        .opt-letter {\n            width: 26px;\n            height: 26px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            border-radius: 50%;\n            border: 2px solid #cbd5e1;\n            background-color: #f8fafc;\n            color: #64748b;\n            font-weight: bold;\n            font-size: 12px;\n            margin-right: 10px;\n            flex-shrink: 0;\n            transition: all 0.2s;\n        }\n\n        /* Khi được chọn */\n        .mcq-option input:checked + .opt-letter {\n            background-color: #2563eb;\n            border-color: #2563eb;\n            color: white;\n        }\n        .mcq-option:has(input:checked) {\n            background-color: #eff6ff;\n            border-color: #3b82f6;\n        }\n\t\t\n\t\t/* CSS cho Map Grid */\n        .map-grid-table { width: 100%; border-collapse: collapse; margin: 16px 0; table-layout: auto; }\n        .map-grid-table th, .map-grid-table td { border: 1px solid #cbd5e1; padding: 6px; text-align: center; vertical-align: middle; }\n        .map-radio { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }\n        td.correct-text { background-color: #dcfce7 !important; border-color: #22c55e !important; }\n        td.incorrect-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; }\n\t\t\n\t\t/* Question Palette trên Header */\n\t\t#question-palette::-webkit-scrollbar { display: none; }\n\t\t.palette-btn { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; border: 1px solid #cbd5e1; background: white; color: #475569; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }\n\t\t.palette-btn:hover { background: #f1f5f9; border-color: #94a3b8; }\n\t\t.palette-btn.answered { background: #bae6fd; border-color: #38bdf8; color: #0284c7; }\n\t\t.palette-btn.correct { background: #22c55e !important; border-color: #16a34a !important; color: white !important; }\n\t\t.palette-btn.incorrect { background: #ef4444 !important; border-color: #dc2626 !important; color: white !important; }\n\t\t@keyframes blinkEffect { 0%, 100% { background-color: transparent; outline: none; } 50% { background-color: #fef08a; outline: 2px solid #eab308; } }\n\t\t.blink-effect { animation: blinkEffect 0.6s ease-in-out 3; border-radius: 4px; }\n\t\t\n\t\t/* Nút Play Audio Tại Chỗ */\n        .play-here-btn {\n            width: 22px; height: 22px; border-radius: 50%; display: inline-flex;\n            align-items: center; justify-content: center; cursor: pointer;\n            background: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe;\n            transition: all 0.2s; vertical-align: middle; margin-left: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);\n        }\n        .play-here-btn:hover { background: #bfdbfe; transform: scale(1.1); }\n\t\t\n\t\t/* Hiệu ứng bật lên của Dấu Tick Hoàn Thành */\n        .done-tick {\n            color: #22c55e;\n            margin-left: 6px;\n            font-size: 14px;\n            vertical-align: middle;\n            display: inline-flex;\n            animation: popInTick 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;\n        }\n        @keyframes popInTick { \n            0% { transform: scale(0); opacity: 0; } \n            100% { transform: scale(1); opacity: 1; } \n        }\n\t\t\n\t\t/* Hiệu ứng Chuông báo chú ý */\n        .attention-bell {\n            color: #ef4444;\n            font-size: 12px;\n            font-weight: bold;\n            animation: shakeBell 0.4s ease-in-out infinite;\n            display: inline-flex;\n            align-items: center;\n            margin-left: 8px;\n            background: #fef2f2;\n            padding: 2px 6px;\n            border-radius: 4px;\n            border: 1px solid #fca5a5;\n            vertical-align: middle;\n            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);\n            z-index: 10;\n        }\n        @keyframes shakeBell {\n            0%, 100% { transform: rotate(0deg); }\n            25% { transform: rotate(15deg); }\n            75% { transform: rotate(-15deg); }\n        }\n\t\t\n    </style>\n</head>\n<body class=\"bg-gray-100 h-screen flex flex-col text-gray-800 overflow-hidden\">\n\n<div id=\"dashboard-view\">\n        <div class=\"dash-title\">DANH SÁCH BÀI NGHE</div>\n        <div class=\"card-container\" id=\"card-render-area\"></div>\n    </div>\n    <header class=\"bg-white shadow-sm p-2 md:p-3 flex justify-between items-center z-10 h-auto min-h-[64px] shrink-0 border-b border-gray-200 gap-3\">\n        <div class=\"flex items-center gap-2 md:gap-4 shrink-0\">\n            <button class=\"back-btn !m-0\" onclick=\"goBackToDashboard()\"><i class=\"fa-solid fa-arrow-left\"></i> <span class=\"hidden lg:inline ml-1\">Quay lại</span></button>\n            <h1 class=\"text-base md:text-lg font-bold text-slate-700 flex items-center gap-1 md:gap-2\">\n                <i class=\"fa-solid fa-headphones text-blue-600\"></i> <span class=\"hidden md:inline\">Listening</span>\n                <span id=\"top-total-qs\" class=\"text-[11px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded border border-blue-200 ml-1\">0 câu</span>\n            </h1>\n            <div class=\"hidden\">\n                <select id=\"lesson-selector\" onchange=\"switchLesson(this.value)\"></select>\n            </div>\n        </div>\n\n        <div id=\"question-palette\" class=\"flex-1 flex items-center gap-1.5 overflow-x-auto px-2\" style=\"scrollbar-width: none;\">\n            </div>\n\n        <div class=\"flex gap-2 md:gap-3 items-center shrink-0\">\n\t\t\n\t\t<!-- Công tắc bật chuông báo -->\n            <label class=\"flex items-center gap-1 border-r border-gray-300 pr-2 md:pr-3 mr-1 text-xs md:text-sm font-bold text-red-500 hover:text-red-600 cursor-pointer transition\" title=\"Bật chuông báo hiệu chú ý khi đến câu hỏi\">\n                <input type=\"checkbox\" id=\"bell-toggle\" class=\"accent-red-500 w-4 h-4 cursor-pointer\">\n                <i class=\"fa-solid fa-bell\"></i> <span class=\"hidden xl:inline\">Báo Chú Ý</span>\n            </label>\n\t\t\t\n            <div class=\"flex items-center gap-1 border-r border-gray-300 pr-2 md:pr-3 mr-1\">\n                <input type=\"color\" id=\"hl-color\" value=\"#fef08a\" class=\"w-6 h-6 md:w-7 md:h-7 p-0 border-0 rounded cursor-pointer shrink-0\" title=\"Chọn màu Highlight\">\n                <button id=\"hl-toggle\" onclick=\"toggleHighlightMode()\" class=\"bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 md:px-3 md:py-1 rounded text-xs md:text-sm font-bold shadow-sm transition border border-gray-300 flex items-center gap-1\">\n                    <i class=\"fa-solid fa-highlighter\"></i> <span class=\"hidden xl:inline\">Bật Highlight</span>\n                </button>\n            </div>\n            \n            <div class=\"bg-slate-100 px-2 py-1 md:px-3 md:py-1 rounded-full text-xs md:text-sm font-mono text-slate-600 border border-slate-200\" id=\"timer\">00:00</div>\n            <button onclick=\"checkResults()\" class=\"bg-green-600 hover:bg-green-700 text-white text-xs md:text-sm font-bold px-3 py-1.5 md:px-4 md:py-1.5 rounded shadow whitespace-nowrap\"><i class=\"fa-solid fa-check mr-1\"></i> Nộp Bài</button>\n        </div>\n    </header>\n    \n    <main class=\"flex-1 flex flex-col md:flex-row overflow-hidden\" id=\"main-container\">\n        <div id=\"pane-transcript\" class=\"w-full md:w-[40%] flex flex-col border-r border-gray-200 bg-white relative z-10 min-w-[250px]\">\n            <div class=\"p-4 bg-slate-900 text-white shadow-md shrink-0\">\n                <audio id=\"audio\" class=\"w-full h-10 mb-2\" controls></audio>\n                <div class=\"flex items-center justify-between\" id=\"trans-btn-container\"></div>\n            </div>\n            <div id=\"transcript-container\" class=\"flex-1 overflow-y-auto p-4 md:p-6 bg-white scroll-smooth\">\n                <div id=\"transcript\" class=\"text-base md:text-lg leading-relaxed max-w-2xl mx-auto\"></div>\n            </div>\n            <div id=\"transcript-placeholder\" class=\"hidden flex-1 flex items-center justify-center bg-slate-50 text-slate-400 p-10 text-center italic\">\n                <div><i class=\"fa-solid fa-eye-slash text-3xl mb-3\"></i><br>Transcript is currently hidden.</div>\n            </div>\n        </div>\n        \n        <div id=\"resizer-1\" class=\"resizer-bar hidden md:flex\"></div>\n\n        <div id=\"pane-right\" class=\"flex-1 flex flex-col md:flex-row overflow-hidden relative bg-slate-50\">\n            <div id=\"pane-questions\" class=\"flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth min-w-[300px]\">\n                <div class=\"max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100 min-h-full\">\n\t\t\t\n\t\t\t\n\t\t\t<div id=\"questions-content\"></div>\n\t\t\t<div id=\"result-message\" class=\"hidden mt-6 p-4 rounded bg-blue-50 text-blue-800 text-center font-bold border border-blue-200\"></div>\n\t\t\t\n\t\t\t<div id=\"bottom-actions\" class=\"hidden mt-6 flex flex-wrap justify-between items-center gap-4 border-t pt-6\">\n\t\t\t\t<button onclick=\"saveCurrentResult()\" class=\"bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-bold shadow transition text-sm\">\n\t\t\t\t\t<i class=\"fa-solid fa-floppy-disk mr-1\"></i> Save Result\n\t\t\t\t</button>\n\t\t\t\t<button id=\"btn-next-lesson\" onclick=\"goToNextLesson()\" class=\"bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-lg font-bold shadow transition text-sm ml-auto hidden\">\n\t\t\t\t</button>\n    </div>\n</div>\n            </div>\n        </div>\n    </main>\n<div id=\"floating-note-btn\" onclick=\"createNote()\"><i class=\"fa-solid fa-pen-to-square mr-1\"></i> Note</div>\n    <script>\n\t\n\twindow.playAudioFrom = function(time) {\n            const audio = document.getElementById('audio');\n            if (audio) {\n                audio.currentTime = time;\n                audio.play();\n            }\n        };\n\t\n\t// --- HIGHLIGHT & NOTE LOGIC ---\n        let isHlMode = false;\n\n        function toggleHighlightMode() {\n            isHlMode = !isHlMode;\n            const btn = document.getElementById('hl-toggle');\n            if (isHlMode) {\n                btn.classList.replace('bg-gray-100', 'bg-yellow-300');\n                btn.classList.replace('hover:bg-gray-200', 'hover:bg-yellow-400');\n                btn.classList.replace('text-gray-700', 'text-yellow-900');\n                btn.innerHTML = '<i class=\"fa-solid fa-highlighter\"></i> Đang HL...';\n            } else {\n                btn.classList.replace('bg-yellow-300', 'bg-gray-100');\n                btn.classList.replace('hover:bg-yellow-400', 'hover:bg-gray-200');\n                btn.classList.replace('text-yellow-900', 'text-gray-700');\n                btn.innerHTML = '<i class=\"fa-solid fa-highlighter\"></i> Bật Highlight';\n            }\n        }\n\n        document.addEventListener('mouseup', function(e) {\n            // Bỏ qua nếu click vào nút float\n            if(e.target.id === 'floating-note-btn') return;\n\n            const selection = window.getSelection();\n            const text = selection.toString().trim();\n            const floatBtn = document.getElementById('floating-note-btn');\n\n            // Chỉ kích hoạt khi bôi đen nội dung trong vùng làm bài\n            if (text.length > 0 && e.target.closest('#main-container')) {\n                if (isHlMode) {\n                    applyHighlight(selection);\n                    floatBtn.style.display = 'none';\n                } else {\n                    // Nếu đang tắt Highlight -> Hiện nút Note\n                    const range = selection.getRangeAt(0);\n                    const rect = range.getBoundingClientRect();\n                    floatBtn.style.display = 'block';\n                    floatBtn.style.top = (rect.top + window.scrollY - 35) + 'px';\n                    floatBtn.style.left = (rect.left + window.scrollX + (rect.width/2) - 30) + 'px';\n                    window.currentNoteRange = range.cloneRange();\n                }\n            } else {\n                floatBtn.style.display = 'none';\n            }\n        });\n\n        function applyHighlight(selection) {\n            const color = document.getElementById('hl-color').value;\n            const range = selection.getRangeAt(0);\n            const span = document.createElement('span');\n            span.className = 'user-hl';\n            span.style.backgroundColor = color;\n            span.title = \"Click để xóa highlight\";\n            \n            try {\n                range.surroundContents(span);\n            } catch(e) {\n                alert(\"Vui lòng bôi đen từng đoạn ngắn, không bôi đen chéo qua các ô trống hoặc nhiều dòng cùng lúc.\");\n            }\n            selection.removeAllRanges();\n        }\n\n        function createNote() {\n            document.getElementById('floating-note-btn').style.display = 'none';\n            const noteText = prompt(\"Nhập nội dung ghi chú cho cụm từ này:\");\n            \n            if (noteText && window.currentNoteRange) {\n                const span = document.createElement('span');\n                span.className = 'user-note';\n                span.dataset.note = noteText;\n                span.title = noteText;\n                try {\n                    window.currentNoteRange.surroundContents(span);\n                } catch(e) {\n                    alert(\"Vui lòng bôi đen đoạn văn bản liên tục, không chứa ô trống điền từ.\");\n                }\n            }\n            window.getSelection().removeAllRanges();\n        }\n\n        // Ủy quyền sự kiện click để Xóa Highlight hoặc Sửa Note\n        document.addEventListener('click', function(e) {\n            // Xóa Highlight\n            if (e.target.classList.contains('user-hl')) {\n                const parent = e.target.parentNode;\n                while (e.target.firstChild) {\n                    parent.insertBefore(e.target.firstChild, e.target);\n                }\n                parent.removeChild(e.target);\n            }\n\n            // Mở và Sửa Note\n            if (e.target.classList.contains('user-note')) {\n                const currentNote = e.target.dataset.note;\n                const newNote = prompt(\"Chỉnh sửa ghi chú (Xóa trắng để gỡ bỏ ghi chú):\", currentNote);\n                \n                if (newNote === null) return; // Nhấn Cancel\n                \n                if (newNote.trim() === \"\") {\n                    // Xóa hoàn toàn note\n                    const parent = e.target.parentNode;\n                    while (e.target.firstChild) {\n                        parent.insertBefore(e.target.firstChild, e.target);\n                    }\n                    parent.removeChild(e.target);\n                } else {\n                    // Cập nhật nội dung mới\n                    e.target.dataset.note = newNote;\n                    e.target.title = newNote;\n                }\n            }\n        });\n        const lessonsData = [{\"name\":\"EXERCISE 1\",\"audio\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/b1-test-11-1.mp3\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"imgLeft\":false,\"answerKey\":{\"q-auto-0\":\"B\",\"q-auto-1\":\"C\",\"q-auto-2\":\"A\",\"q-auto-3\":\"C\",\"q-auto-4\":\"A\",\"q-auto-5\":\"C\",\"q-auto-6\":\"C\"},\"itemImages\":{\"q-auto-0\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/b1-test-11-1.jpg\",\"q-auto-1\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/b1-test-11-2.jpg\",\"q-auto-2\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/b1-test-11-3.jpg\",\"q-auto-3\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/b1-test-11-4.jpg\",\"q-auto-4\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/b1-test-11-5.jpg\",\"q-auto-5\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/b1-test-11-6.jpg\",\"q-auto-6\":\"https://englishpracticetest.n ime=\\\"2.799\\\">I\\\\'ve just arrived for my singing lesson with Mrs.\\u003c/p>\\n\\u003cp data-time=\\\"7.028\\\">Thompson. What are you doing here?\\u003c/p>\\n\\u003cp data-time=\\\"10.050\\\">I\\\\'ve come for a singing lesson too.\\u003c/p>\\n\\u003cp data-time=\\\"12.001\\\">Well, if it\\\\'s a secret, I won\\\\'t tell anyone.\\u003c/p>\\n\\u003cp data-time=\\\"16.400\\\">It\\\\'s okay, Louise. I\\\\'m going to be in a musical show, so everyone will know soon.\\u003c/p>\\n\\u003cp data-time=\\\"21.001\\\">Really? Can you actually sing then?\\u003c/p>\\n\\u003cp data-time=\\\"25.700\\\">Well, I was taught to sing at school, you know, but now I\\\\'m in the show.\\u003c/p>\\n\\u003cp data-time=\\\"29.563\\\">I thought I\\\\'d better have a few more lessons.\\u003c/p>\\n\\u003cp data-time=\\\"32.349\\\">Good idea.\\u003c/p>\\n\\u003cp data-time=\\\"34.001\\\">What do you think of Mrs. Thompson? She\\\\'s really strict, isn\\\\'t she?\\u003c/p>\\n\\u003cp data-time=\\\"38.001\\\">She is, but I think if you want to sing properly, then she\\\\'s the best teacher.\\u003c/p>\\n\\u003cp data-time=\\\"44.249\\\">You don\\\\'t have to like her to see that she\\\\'s really brilliant.\\u003c/p>\\n\\u003cp data-time=\\\"47.224\\\">Oh, I suppose so. It\\\\'s just that she makes me feel so nervous.\\u003c/p>\\n\\u003cp data-time=\\\"52.001\\\">How did you get chosen for the show?\\u003c/p>\\n\\u003cp data-time=\\\"55.949\\\">Well, I went to see a few musical shows before Christmas.\\u003c/p>\\n\\u003cp data-time=\\\"59.174\\\">I don\\\\'t know why, because I\\\\'ve never really liked them before.\\u003c/p>\\n\\u003cp data-time=\\\"63.199\\\">And I thought, I\\\\'d like to do that.\\u003c/p>\\n\\u003cp data-time=\\\"65.499\\\">So I tried for a part in the show at the Regent Theatre, and got it.\\u003c/p>\\n\\u003cp data-time=\\\"69.001\\\">Well done.\\u003c/p>\\n\\u003cp data-time=\\\"71.199\\\">So have you actually done a show yet?\\u003c/p>\\n\\u003cp data-time=\\\"73.001\\\">Yes, we\\\\'ve done a practice show just for family and friends.\\u003c/p>\\n\\u003cp data-time=\\\"77.249\\\">So how did you feel?\\u003c/p>\\n\\u003cp data-time=\\\"79.001\\\">Well, when we\\\\'d finished, I wanted to cry because I was so delighted\\u003c/p>\\n\\u003cp data-time=\\\"83.001\\\">that I\\\\'d actually got through it without making any big mistakes.\\u003c/p>\\n\\u003cp data-time=\\\"87.001\\\">But did people like it?\\u003c/p>\\n\\u003cp data-time=\\\"89.199\\\">Yes, they did, and it was great to have an audience.\\u003c/p>\\n\\u003cp data-time=\\\"92.199\\\">I would love to be able to sing and have everybody listen and clap.\\u003c/p>\\n\\u003cp data-time=\\\"96.001\\\">It\\\\'s quite hard to do a musical show, actually.\\u003c/p>\\n\\u003cp data-time=\\\"99.624\\\">You have to dance as well as sing. It\\\\'s hard work to get it right.\\u003c/p>\\n\\u003cp data-time=\\\"103.001\\\">Oh, I wouldn\\\\'t be keen on that.\\u003c/p>\\n\\u003cp data-time=\\\"105.001\\\">I\\\\'m only a singer, really.\\u003c/p>\\n\\u003cp data-time=\\\"107.001\\\">When does the show open?\\u003c/p>\\n\\u003cp data-time=\\\"110.001\\\">On the 9th of October.\\u003c/p>\\n\\u003cp data-time=\\\"112.399\\\">Would you like a couple of free tickets?\\u003c/p>\\n\\u003cp data-time=\\\"114.024\\\">Oh, yes, thanks.\\u003c/p>\\n\\u003cp data-time=\\\"121.449\\\">Now listen again.\\u003c/p>\\n\\u003cp data-time=\\\"124.749\\\">John.\\u003c/p>\\n\\u003cp data-time=\\\"126.001\\\">Oh Louise, hi.\\u003c/p>\\n\\u003cp data-time=\\\"127.001\\\">I\\\\'ve just arrived for my singing lesson with Mrs. Thompson.\\u003c/p>\\n\\u003cp data-time=\\\"130.600\\\">What are you doing here?\\u003c/p>\\n\\u003cp data-time=\\\"132.050\\\">I\\\\'ve come for a singing lesson too.\\u003c/p>\\n\\u003cp data-time=\\\"134.150\\\">Well, if it\\\\'s a secret, I won\\\\'t tell anyone.\\u003c/p>\\n\\u003cp data-time=\\\"138.400\\\">It\\\\'s OK, Louise. I\\\\'m going to be in a musical show.\\u003c/p>\\n\\u003c
