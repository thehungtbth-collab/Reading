<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hệ thống Bài tập</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--accent1:#6a11cb;--accent2:#2575fc;--muted:#6b7280;--border:#e2e8f0}
    html, body { height: 100%; margin: 0; font-family:Inter,system-ui,Arial; background:var(--bg); color:#0f172a; overflow:hidden;}
    
    .layout { display: flex; height: 100vh; width: 100vw; }
    
    .main-content { flex: 1; display:flex; flex-direction:column; background: #fff; position: relative; min-width:0;}
    .toolbar { height: 50px; background: #fff; border-bottom: 1px solid var(--border); display:flex; align-items:center; padding: 0 20px; font-weight:bold; color: #475569; justify-content: space-between;}
    #frame { flex: 1; width: 100%; border: none; background: #fff; }
    
    .sidebar { 
      width: 320px; background: var(--card); border-left: 1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; padding:15px; box-shadow: -2px 0 8px rgba(0,0,0,0.03); z-index:10; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease, border 0.3s ease; flex-shrink: 0;
    }
    .sidebar h2 { margin-top:0; font-size:17px; color:var(--accent2); padding-bottom:12px; border-bottom:1px solid var(--border); }
    .sidebar.collapsed { width: 0; padding: 0; border-left: none; overflow: hidden; }

    .toggle-btn { background: linear-gradient(90deg, var(--accent1), var(--accent2)); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(37,117,252,0.15); user-select: none; }
    .toggle-btn:hover { opacity: 0.9; }
    
    ul { list-style: none; padding-left: 15px; margin: 0; }
    ul.root { padding-left: 0; }
    li { margin: 6px 0; }
    .folder-title, .file-title { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; user-select: none; transition: background 0.15s; }
    .folder-title { font-weight: 600; color: #334155; }
    .folder-title:hover { background: #f1f5f9; }
    .file-title { color: #475569; display: flex; align-items: center; gap: 6px;}
    .file-title:hover { background: #e0e7ff; color: #3730a3; }
    .file-title.active { background: var(--accent2); color: #fff; font-weight:bold; }
    
    .folder-children { display: block; }
    .folder-children.collapsed { display: none; }
    .folder-icon::before { content: '📂 '; }
    .folder-title.collapsed .folder-icon::before { content: '📁 '; }

    @media (max-width:768px){ 
      .sidebar { position: absolute; right: -320px; left: auto; height: 100%; transition: right 0.3s ease; width: 320px; }
      .sidebar.open { right: 0; width: 320px; padding: 15px; border-left: 1px solid var(--border); }
      .sidebar.collapsed { right: -320px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="main-content">
      <div class="toolbar">
        <span id="currentTitle" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 70%;">Vui lòng chọn bài tập bên menu phải</span>
        <button id="toggleSidebarBtn" class="toggle-btn">📁 Danh sách bài</button>
      </div>
      <iframe id="frame" srcdoc="<div style='padding:30px; font-family:sans-serif; text-align:center; color:#64748b; line-height:1.6;'><h3>HỆ THỐNG BÀI TẬP ONLINE</h3><p>Vui lòng click vào nút <b>'Danh sách bài'</b> ở góc trên bên phải hoặc chọn một bài tập cụ thể để bắt đầu.</p></div>"></iframe>
    </div>
    
    <div class="sidebar" id="sidebar">
      <h2>Hệ thống Bài tập</h2>
      <div id="treeContainer"></div>
    </div>
  </div>

  <script>
    const templatesData = [{"id":"40mud1de1","name":"LISTENING PRACTICE (09.09.2026) (A2 - 18 - 19 - 20).html","content":"<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Listening Exercises</title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <style>\n        ::-webkit-scrollbar { width: 8px; }\n        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }\n        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }\n        #transcript p { padding: 8px 12px; margin-bottom: 4px; border-radius: 6px; transition: all 0.3s; color: #64748b; cursor: pointer; border-left: 3px solid transparent; }\n        #transcript p:hover { background: #f8fafc; }\n        #transcript p.active { background: #eff6ff; color: #1e40af; font-weight: 500; border-left-color: #3b82f6; }\n        @keyframes sparkleAnim { 0% { transform: scale(1); text-shadow: none; color: inherit; } 50% { transform: scale(1.5); text-shadow: 0 0 10px #fbbf24; color: #d97706; } 100% { transform: scale(1); } }\n        .keyword-sparkle { transition: all 0.3s; border-bottom: 2px solid transparent; display: inline-block; }\n        .keyword-sparkle.trigger { animation: sparkleAnim 1.5s ease-in-out; font-weight: bold; border-bottom-color: #f59e0b; }\n        .text-highlight { background-color: #fef08a; color: #854d0e; padding: 0 2px; border-radius: 2px; font-weight: bold; transition: all 0.3s; }\n        #transcript p.active .text-highlight { background-color: #facc15; }\n        \n        input[type=\"text\"] { transition: all 0.3s; border-bottom: 2px solid #cbd5e1; padding: 2px 8px; text-align: center; color: #2563eb; font-weight: 600; background: #f8fafc; border-radius: 4px 4px 0 0; min-width: 60px; }\n        input[type=\"text\"]:focus { outline: none; border-bottom-color: #3b82f6; background: #eff6ff; }\n        \n        /* Hiệu ứng Alert và Sparkle */\n        input[type=\"text\"].highlight-input { background-color: #fef9c3; border-bottom-color: #eab308; transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }\n        .question-block { transition: all 0.3s; }\n        .question-block.highlight-block { border-left: 4px solid #ef4444; background: #fef2f2; padding-left: 12px; }\n\n        /* Table Styles */\n        .generated-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9em; }\n        .generated-table td, .generated-table th { border: 1px solid #e2e8f0; padding: 8px; vertical-align: middle; }\n        .generated-table tr:nth-child(even) { background-color: #f8fafc; }\n        .generated-table tr:hover { background-color: #f1f5f9; }\n        .generated-table td input { width: 90%; min-width: 40px; }\n\n        .draggable-item { cursor: grab; background: white; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 4px; display: inline-block; margin: 4px; font-size: 0.9em; box-shadow: 0 1px 2px rgba(0,0,0,0.05); user-select: none; transition: all 0.2s; max-width: 100%; word-break: break-word; white-space: normal; line-height: 1.4; text-align: left; }\n        .draggable-item:active { cursor: grabbing; border-color: #3b82f6; }\n        .draggable-item.used { opacity: 0.4; background: #e2e8f0; text-decoration: line-through; pointer-events: none; border-color: #cbd5e1; box-shadow: none; }\n        \n        .drop-zone { display: inline-flex; align-items: center; justify-content: flex-start; min-width: 80px; min-height: 32px; border: 2px dashed #cbd5e1; border-radius: 4px; background: #f8fafc; vertical-align: middle; margin: 0; text-align: left; line-height: 1.4; position: relative; transition: all 0.2s; max-width: 100%; padding: 4px 8px; box-sizing: border-box; overflow: hidden; }\n        .drop-zone.drag-over { background: #eff6ff; border-color: #3b82f6; transform: scale(1.02); }\n        .drop-zone.cursor-pointer:hover { border-color: #94a3b8; background: #f1f5f9; }\n        .drop-zone .dropped-item { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 2px; display: block; width: 100%; font-weight: bold; pointer-events: none; word-break: break-word; white-space: normal; text-align: left; font-size: 0.9em; margin: 0; }\n        \n\t\t/* Grading Styles */\n        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }\n        .incorrect-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }\n        .correct-text { color: #15803d; font-weight: bold; }\n        .correct-feedback { display: block; margin-top: 4px; color: #16a34a; font-weight: bold; font-size: 0.875rem; animation: fadeIn 0.5s; }\n        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }\n        \n        .resizer-bar { width: 8px; background-color: #cbd5e1; cursor: col-resize; flex-shrink: 0; z-index: 30; display: flex; justify-content: center; align-items: center; border-left: 1px solid #94a3b8; }\n        .resizer-bar::after { content: \"||\"; color: #475569; font-size: 10px; }\n\t\t\n\t\t/* --- GIAO DIỆN DASHBOARD CARD --- */\n        #dashboard-view { position: fixed; inset: 0; background: #f4f7f6; z-index: 1000; overflow-y: auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }\n        .dash-title { font-size: 24px; font-weight: 800; color: #0f766e; margin-bottom: 30px; text-transform: uppercase; }\n        .card-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; width: 100%; }\n        .test-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; width: 340px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; display: flex; flex-direction: column; }\n        .test-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }\n        .card-header { display: flex; align-items: flex-start; gap: 10px; color: #115e59; font-weight: 700; font-size: 16px; margin-bottom: 12px; text-transform: uppercase; line-height: 1.4; }\n        .q-types-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; flex: 1; align-content: flex-start; }\n        .q-tag { background: #fff; border: 1px solid #e2e8f0; color: #475569; font-size: 11px; padding: 4px 8px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 4px; font-weight: 600; }\n        .q-tag-count { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; }\n        .card-stats { background: #fff1f2; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; margin-bottom: 20px; }\n        .stat-item { display: flex; align-items: center; gap: 6px; color: #9a3412; font-size: 13px; font-weight: 600; }\n        .btn-enter { background: #e0f2fe; color: #0369a1; padding: 10px 0; width: 100%; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #bae6fd; transition: 0.2s; text-align: center; }\n        .btn-enter:hover { background: #bae6fd; }\n        \n        /* Ẩn giao diện chính khi ở sảnh chờ */\n        body.in-dashboard > header, body.in-dashboard > main { display: none !important; }\n        \n        /* Nút quay lại */\n        .back-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: 0.2s; margin-right: 16px; }\n        .back-btn:hover { background: #e2e8f0; color: #1e293b; }\n\t\t\n\t\t/* User Highlight & Note Styles */\n        .user-hl { cursor: pointer; border-radius: 2px; transition: opacity 0.2s; }\n        .user-hl:hover { opacity: 0.7; }\n        .user-note { \n            border-bottom: 2px dashed #f59e0b; \n            background-color: rgba(245, 158, 11, 0.1); \n            cursor: pointer; \n            position: relative; \n            transition: all 0.2s;\n        }\n        .user-note:hover { background-color: rgba(245, 158, 11, 0.3); }\n        .user-note::after {\n            content: '\\f249'; /* FontAwesome sticky-note icon */\n            font-family: \"Font Awesome 6 Free\";\n            font-weight: 900;\n            font-size: 10px;\n            color: #d97706;\n            vertical-align: super;\n            margin-left: 2px;\n        }\n        #floating-note-btn { \n            position: absolute; z-index: 1000; \n            background: #1e293b; color: white; \n            padding: 5px 12px; border-radius: 6px; \n            font-size: 13px; font-weight: bold; \n            cursor: pointer; display: none; \n            box-shadow: 0 4px 6px rgba(0,0,0,0.2); \n        }\n        #floating-note-btn:hover { background: #3b82f6; }\n\t\t\n/* Style số câu hỏi giống hệt gap-fill */\n        .q-badge {\n            background-color: #dbeafe; /* bg-blue-100 */\n            color: #1d4ed8; /* text-blue-700 */\n            padding: 2px 6px; /* px-1.5 py-0.5 */\n            border-radius: 4px; /* rounded */\n            font-size: 11px; /* text-[11px] */\n            font-weight: 700; /* font-bold */\n            border: 1px solid #bfdbfe; /* border-blue-200 */\n            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */\n            display: inline-block;\n            vertical-align: middle;\n            margin-right: 6px;\n        }\n\n        /* MCQ Option: Chữ cái nằm trong nút tròn */\n        .mcq-option {\n            display: flex;\n            align-items: center;\n            padding: 8px 12px;\n            margin-bottom: 5px;\n            border: 1px solid #e2e8f0;\n            border-radius: 8px;\n            cursor: pointer;\n            transition: all 0.2s;\n            background: #fff;\n        }\n        .mcq-option:hover { background-color: #f8fafc; border-color: #cbd5e1; }\n        .mcq-option input { display: none; } /* Ẩn nút radio/checkbox gốc */\n\n        .opt-letter {\n            width: 26px;\n            height: 26px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            border-radius: 50%;\n            border: 2px solid #cbd5e1;\n            background-color: #f8fafc;\n            color: #64748b;\n            font-weight: bold;\n            font-size: 12px;\n            margin-right: 10px;\n            flex-shrink: 0;\n            transition: all 0.2s;\n        }\n\n        /* Khi được chọn */\n        .mcq-option input:checked + .opt-letter {\n            background-color: #2563eb;\n            border-color: #2563eb;\n            color: white;\n        }\n        .mcq-option:has(input:checked) {\n            background-color: #eff6ff;\n            border-color: #3b82f6;\n        }\n\t\t\n\t\t/* CSS cho Map Grid */\n        .map-grid-table { width: 100%; border-collapse: collapse; margin: 16px 0; table-layout: auto; }\n        .map-grid-table th, .map-grid-table td { border: 1px solid #cbd5e1; padding: 6px; text-align: center; vertical-align: middle; }\n        .map-radio { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }\n        td.correct-text { background-color: #dcfce7 !important; border-color: #22c55e !important; }\n        td.incorrect-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; }\n\t\t\n\t\t/* Question Palette trên Header */\n\t\t#question-palette::-webkit-scrollbar { display: none; }\n\t\t.palette-btn { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; border: 1px solid #cbd5e1; background: white; color: #475569; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }\n\t\t.palette-btn:hover { background: #f1f5f9; border-color: #94a3b8; }\n\t\t.palette-btn.answered { background: #bae6fd; border-color: #38bdf8; color: #0284c7; }\n\t\t.palette-btn.correct { background: #22c55e !important; border-color: #16a34a !important; color: white !important; }\n\t\t.palette-btn.incorrect { background: #ef4444 !important; border-color: #dc2626 !important; color: white !important; }\n\t\t@keyframes blinkEffect { 0%, 100% { background-color: transparent; outline: none; } 50% { background-color: #fef08a; outline: 2px solid #eab308; } }\n\t\t.blink-effect { animation: blinkEffect 0.6s ease-in-out 3; border-radius: 4px; }\n\t\t\n\t\t/* Nút Play Audio Tại Chỗ */\n        .play-here-btn {\n            width: 22px; height: 22px; border-radius: 50%; display: inline-flex;\n            align-items: center; justify-content: center; cursor: pointer;\n            background: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe;\n            transition: all 0.2s; vertical-align: middle; margin-left: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);\n        }\n        .play-here-btn:hover { background: #bfdbfe; transform: scale(1.1); }\n\t\t\n\t\t/* Hiệu ứng bật lên của Dấu Tick Hoàn Thành */\n        .done-tick {\n            color: #22c55e;\n            margin-left: 6px;\n            font-size: 14px;\n            vertical-align: middle;\n            display: inline-flex;\n            animation: popInTick 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;\n        }\n        @keyframes popInTick { \n            0% { transform: scale(0); opacity: 0; } \n            100% { transform: scale(1); opacity: 1; } \n        }\n\t\t\n\t\t/* Hiệu ứng Chuông báo chú ý */\n        .attention-bell {\n            color: #ef4444;\n            font-size: 12px;\n            font-weight: bold;\n  none;\">\n            </div>\n\n        <div class=\"flex gap-2 md:gap-3 items-center shrink-0\">\n\t\t\n\t\t<!-- Công tắc bật chuông báo -->\n            <label class=\"flex items-center gap-1 border-r border-gray-300 pr-2 md:pr-3 mr-1 text-xs md:text-sm font-bold text-red-500 hover:text-red-600 cursor-pointer transition\" title=\"Bật chuông báo hiệu chú ý khi đến câu hỏi\">\n                <input type=\"checkbox\" id=\"bell-toggle\" class=\"accent-red-500 w-4 h-4 cursor-pointer\">\n                <i class=\"fa-solid fa-bell\"></i> <span class=\"hidden xl:inline\">Báo Chú Ý</span>\n            </label>\n\t\t\t\n            <div class=\"flex items-center gap-1 border-r border-gray-300 pr-2 md:pr-3 mr-1\">\n                <input type=\"color\" id=\"hl-color\" value=\"#fef08a\" class=\"w-6 h-6 md:w-7 md:h-7 p-0 border-0 rounded cursor-pointer shrink-0\" title=\"Chọn màu Highlight\">\n                <button id=\"hl-toggle\" onclick=\"toggleHighlightMode()\" class=\"bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 md:px-3 md:py-1 rounded text-xs md:text-sm font-bold shadow-sm transition border border-gray-300 flex items-center gap-1\">\n                    <i class=\"fa-solid fa-highlighter\"></i> <span class=\"hidden xl:inline\">Bật Highlight</span>\n                </button>\n            </div>\n            \n            <div class=\"bg-slate-100 px-2 py-1 md:px-3 md:py-1 rounded-full text-xs md:text-sm font-mono text-slate-600 border border-slate-200\" id=\"timer\">00:00</div>\n            <button onclick=\"checkResults()\" class=\"bg-green-600 hover:bg-green-700 text-white text-xs md:text-sm font-bold px-3 py-1.5 md:px-4 md:py-1.5 rounded shadow whitespace-nowrap\"><i class=\"fa-solid fa-check mr-1\"></i> Nộp Bài</button>\n        </div>\n    </header>\n    \n    <main class=\"flex-1 flex flex-col md:flex-row overflow-hidden\" id=\"main-container\">\n        <div id=\"pane-transcript\" class=\"w-full md:w-[40%] flex flex-col border-r border-gray-200 bg-white relative z-10 min-w-[250px]\">\n            <div class=\"p-4 bg-slate-900 text-white shadow-md shrink-0\">\n                <audio id=\"audio\" class=\"w-full h-10 mb-2\" controls></audio>\n                <div class=\"flex items-center justify-between\" id=\"trans-btn-container\"></div>\n            </div>\n            <div id=\"transcript-container\" class=\"flex-1 overflow-y-auto p-4 md:p-6 bg-white scroll-smooth\">\n                <div id=\"transcript\" class=\"text-base md:text-lg leading-relaxed max-w-2xl mx-auto\"></div>\n            </div>\n            <div id=\"transcript-placeholder\" class=\"hidden flex-1 flex items-center justify-center bg-slate-50 text-slate-400 p-10 text-center italic\">\n                <div><i class=\"fa-solid fa-eye-slash text-3xl mb-3\"></i><br>Transcript is currently hidden.</div>\n            </div>\n        </div>\n        \n        <div id=\"resizer-1\" class=\"resizer-bar hidden md:flex\"></div>\n\n        <div id=\"pane-right\" class=\"flex-1 flex flex-col md:flex-row overflow-hidden relative bg-slate-50\">\n            <div id=\"pane-questions\" class=\"flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth min-w-[300px]\">\n                <div class=\"max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100 min-h-full\">\n\t\t\t\n\t\t\t\n\t\t\t<div id=\"questions-content\"></div>\n\t\t\t<div id=\"result-message\" class=\"hidden mt-6 p-4 rounded bg-blue-50 text-blue-800 text-center font-bold border border-blue-200\"></div>\n\t\t\t\n\t\t\t<div id=\"bottom-actions\" class=\"hidden mt-6 flex flex-wrap justify-between items-center gap-4 border-t pt-6\">\n\t\t\t\t<button onclick=\"saveCurrentResult()\" class=\"bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-bold shadow transition text-sm\">\n\t\t\t\t\t<i class=\"fa-solid fa-floppy-disk mr-1\"></i> Save Result\n\t\t\t\t</button>\n\t\t\t\t<button id=\"btn-next-lesson\" onclick=\"goToNextLesson()\" class=\"bg-sky-500 hover:bg-sky-600 tex lMode) {\n                    applyHighlight(selection);\n                    floatBtn.style.display = 'none';\n                } else {\n                    // Nếu đang tắt Highlight -> Hiện nút Note\n                    const range = selection.getRangeAt(0);\n                    const rect = range.getBoundingClientRect();\n                    floatBtn.style.display = 'block';\n                    floatBtn.style.top = (rect.top + window.scrollY - 35) + 'px';\n                    floatBtn.style.left = (rect.left + window.scrollX + (rect.width/2) - 30) + 'px';\n                    window.currentNoteRange = range.cloneRange();\n                }\n            } else {\n                floatBtn.style.display = 'none';\n            }\n        });\n\n        function applyHighlight(selection) {\n            const color = document.getElementById('hl-color').value;\n            const range = selection.getRangeAt(0);\n            const span = document.createElement('span');\n            span.className = 'user-hl';\n            span.style.backgroundColor = color;\n            span.title = \"Click để xóa highlight\";\n            \n            try {\n                range.surroundContents(span);\n            } catch(e) {\n                alert(\"Vui lòng bôi đen từng đoạn ngắn, không bôi đen chéo qua các ô trống hoặc nhiều dòng cùng lúc.\");\n            }\n            selection.removeAllRanges();\n        }\n\n        function createNote() {\n            document.getElementById('floating-note-btn').style.display = 'none';\n            const noteText = prompt(\"Nhập nội dung ghi chú cho cụm từ này:\");\n            \n            if (noteText && window.currentNoteRange) {\n                const span = document.createElement('span');\n                span.className = 'user-note';\n                span.dataset.note = noteText;\n                span.title = noteText;\n                try {\n                    window.currentNoteRange.surroundContents(span);\n                } catch(e) {\n                    alert(\"Vui lòng bôi đen đoạn văn bản liên tục, không chứa ô trống điền từ.\");\n                }\n            }\n            window.getSelection().removeAllRanges();\n        }\n\n        // Ủy quyền sự kiện click để Xóa Highlight hoặc Sửa Note\n        document.addEventListener('click', function(e) {\n            // Xóa Highlight\n            if (e.target.classList.contains('user-hl')) {\n                const parent = e.target.parentNode;\n                while (e.target.firstChild) {\n                    parent.insertBefore(e.target.firstChild, e.target);\n                }\n                parent.removeChild(e.target);\n            }\n\n            // Mở và Sửa Note\n            if (e.target.classList.contains('user-note')) {\n                const currentNote = e.target.dataset.note;\n                const newNote = prompt(\"Chỉnh sửa ghi chú (Xóa trắng để gỡ bỏ ghi chú):\", currentNote);\n                \n                if (newNote === null) return; // Nhấn Cancel\n                \n                if (newNote.trim() === \"\") {\n                    // Xóa hoàn toàn note\n                    const parent = e.target.parentNode;\n                    while (e.target.firstChild) {\n                        parent.insertBefore(e.target.firstChild, e.target);\n                    }\n                    parent.removeChild(e.target);\n                } else {\n                    // Cập nhật nội dung mới\n                    e.target.dataset.note = newNote;\n                    e.target.title = newNote;\n                }\n            }\n        });\n        const lessonsData = [{\"name\":\"EXERCISE 1\",\"audio\":\"https://englishpracticetest.net/wp-content/uploads/2022/11/a2-test-18-01.mp3\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"imgLeft\":false,\"answerKey\":{\"q-auto-0\":\"A\",\"q-auto-1\":\"C\",\"q-auto-2\":\"A\",\"q-auto-3\":\"A\",\"q-auto-4\":\"B\"},\"itemImages\":{\"q-auto-0\":\"https://englishpracticetest.ne
